name: Bug report
description: Report a reproducible defect (use private security reporting for vulnerabilities)
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, startup tokens, private task content, Session logs, or Run Store data without redaction.
  - type: input
    id: version
    attributes:
      label: Plugin version or commit
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DeepSeek Harness version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Redacted Harness² configuration
      render: yaml
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted diagnostics
    validations:
      required: true
