name: Feature request
description: Propose a scoped capability or improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete task or deployment limitation should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Cost, data, permission, and sandbox implications
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
