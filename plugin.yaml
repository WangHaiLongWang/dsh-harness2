name: dsh-plugin-harness2
version: 0.1.0
description: Recursive Propose-Probe-Compose harness improvement for DSH
main: dist/src/index.js
permissions:
  filesystem:
    - plugin-data
  network: none
services:
  - harness2
  - harness2-experience-store
events:
  consumes:
    - agent/pre-step
    - agent/request
    - agent/turn-stopping
    - subagent/start
    - subagent_fork
  emits:
    - harness2/run-planned
    - harness2/reference-ready
    - harness2/candidate-ready
    - harness2/probe-finished
    - harness2/composition-finished
    - harness2/selection-finished
    - harness2/reflection-finished
    - harness2/run-finished
